<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We've Moved to a New Home!</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['"Fredoka"', 'sans-serif'],
                        nunito: ['"Nunito"', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 5s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-16px) rotate(1.5deg)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-[#F8FAFC] font-nunito flex items-center justify-center p-6 md:p-12 antialiased overflow-x-hidden">
    
    <div class="max-w-6xl w-full mx-auto grid md:grid-cols-2 gap-12 lg:gap-20 items-center">
        
        <!-- Kolom Kiri: Teks & Cards -->
        <div class="space-y-10 opacity-0 animate-fade-in-up order-last md:order-first flex flex-col items-center md:items-start text-center md:text-left">
            
            <!-- Header Section -->
            <div class="space-y-5">
                <h1 class="font-fredoka text-5xl md:text-6xl font-bold text-slate-800 leading-[1.1]">
                    We’ve Moved <span class="whitespace-nowrap">to a</span> <br>
                    <span class="text-purple-600 text-6xl md:text-7xl block mt-2">New Home!</span>
                </h1>
                <p class="text-lg md:text-xl text-slate-600 leading-relaxed max-w-lg mx-auto md:mx-0">
                    Website ini telah berpindah alamat domain. Silakan pilih halaman yang mungkin ingin anda tuju di bawah ini.
                </p>
            </div>

            <!-- Cards / Pilihan Opsi -->
            <div class="space-y-4 w-full max-w-md md:max-w-none">
                
                <!-- Card 1: Portofolio Utama -->
                <a href="https://porto.farhanalwanda.dev" class="group flex items-center p-5 bg-white rounded-3xl shadow-sm border border-slate-100 transition-all duration-300 hover:shadow-xl hover:shadow-purple-500/15 hover:-translate-y-1.5 hover:border-purple-200 text-left">
                    <div class="flex-shrink-0 w-14 h-14 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center group-hover:scale-110 group-hover:bg-purple-600 group-hover:text-white transition-all duration-300">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="ml-5">
                        <h3 class="font-fredoka text-xl font-semibold text-slate-800 group-hover:text-purple-600 transition-colors">Portofolio Utama</h3>
                        <p class="text-slate-500 text-sm mt-0.5">Langsung ke halaman porto baru</p>
                    </div>
                </a>

                <!-- Card 2: Latest Project -->
                <a href="https://employmee.farhanalwanda.dev" class="group flex items-center p-5 bg-white rounded-3xl shadow-sm border border-slate-100 transition-all duration-300 hover:shadow-xl hover:shadow-amber-500/15 hover:-translate-y-1.5 hover:border-amber-200 text-left">
                    <div class="flex-shrink-0 w-14 h-14 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center group-hover:scale-110 group-hover:bg-amber-500 group-hover:text-white transition-all duration-300">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                        </svg>
                    </div>
                    <div class="ml-5">
                        <h3 class="font-fredoka text-xl font-semibold text-slate-800 group-hover:text-amber-600 transition-colors">Latest Project</h3>
                        <p class="text-slate-500 text-sm mt-0.5">Jobseeker kalau mampir nanti pasti ketagihan</p>
                    </div>
                </a>

                <!-- Card 3: Contact / Socials -->
                <a href="https://links.farhanalwanda.dev" class="group flex items-center p-5 bg-white rounded-3xl shadow-sm border border-slate-100 transition-all duration-300 hover:shadow-xl hover:shadow-emerald-500/15 hover:-translate-y-1.5 hover:border-emerald-200 text-left">
                    <div class="flex-shrink-0 w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center group-hover:scale-110 group-hover:bg-emerald-500 group-hover:text-white transition-all duration-300">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                    </div>
                    <div class="ml-5">
                        <h3 class="font-fredoka text-xl font-semibold text-slate-800 group-hover:text-emerald-600 transition-colors">Contact / Socials</h3>
                        <p class="text-slate-500 text-sm mt-0.5">Ayo berkoneksi dengan saya</p>
                    </div>
                </a>

            </div>
        </div>

        <!-- Kolom Kanan: Asset 3D -->
        <div class="order-first md:order-last relative flex justify-center items-center opacity-0 animate-fade-in-up" style="animation-delay: 0.2s;">
            <!-- Soft glow/shadow behind image -->
            <div class="absolute inset-0 bg-gradient-to-tr from-purple-200 to-amber-200 rounded-full blur-[80px] opacity-40 w-[90%] h-[90%] mx-auto scale-90"></div>
            <!-- Aset Transparan 2 -->
            <img src="./asset2-transparent.png" alt="3D Character Moving Boxes" class="relative z-10 w-full max-w-lg object-contain animate-float pointer-events-none select-none">
        </div>

    </div>

</body>
</html>
